<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Avisos - La Gota</title>
<style>body{font-family:system-ui;background:#070714;color:#fff;margin:0;padding:20px}.box{max-width:480px;margin:0 auto;background:#12122a;border-radius:18px;padding:20px}h1{font-size:22px;margin:0 0 4px} p{color:#b8b8d0;font-size:14px}label{display:block;margin-top:14px;font-weight:700}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#070714;color:#fff;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:16px;padding:16px;border:none;border-radius:12px;background:#FFD400;font-weight:900;font-size:18px;cursor:pointer}#res{margin-top:14px;background:#070714;border-radius:12px;padding:12px;font-size:14px;min-height:40px}.ej{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.ej button{width:auto;padding:8px 12px;font-size:13px;background:#2a2a4a;color:#fff}</style>
</head><body><div class="box">
<h1>📣 Avisos - La Gota 107.5</h1><p>Escribí el aviso y apretá ENVIAR. Les llega a todos los que tienen la app.</p>
<label>Título</label><input id="titulo" value="La Gota 107.5 FM">
<label>Mensaje</label><textarea id="cuerpo" rows="3">Ya estamos en vivo, escuchanos!</textarea>
<div class="ej">
<button onclick="poner('Ya estamos en vivo','Escuchanos en La Gota 107.5')">En vivo</button>
<button onclick="poner('Arranca el programa','Ya estamos al aire, pedí tu tema')">Programa</button>
<button onclick="poner('Sorteo en La Gota','Participá mandando tu nombre al 03462 598048')">Sorteo</button>
</div>
<button onclick="enviar()">📤 ENVIAR AVISO A TODOS</button>
<div id="res">Todavía no mandaste nada.</div>
<p style="font-size:12px">Servidor: https://lagota.online/push - Si te dice error, es porque el VPS está apagado o el servidor de avisos se cayó.</p>
</div>
<script>
function poner(t,c){document.getElementById('titulo').value=t;document.getElementById('cuerpo').value=c;}
async function enviar(){
  const titulo=document.getElementById('titulo').value;
  const cuerpo=document.getElementById('cuerpo').value;
  const res=document.getElementById('res');
  res.textContent="Enviando...";
  try{
    const r=await fetch("https://lagota.online/push/aviso",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({titulo,cuerpo})});
    const d=await r.json();
    res.textContent="✅ Listo! Le llegó a "+d.ok+" de "+d.total+" celus. Título: "+titulo;
  }catch(e){ res.textContent="❌ No se pudo. ¿Está prendido el servidor en el VPS? Error: "+e; }
}
</script></body></html>
